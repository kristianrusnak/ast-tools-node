name: "Generate Commit Message"
order: 60
prompt: |
  Based on the following code changes from ${filePath}:${startLine}-${endLine}, generate a concise commit message following conventional commits format.

  ```
  ${selectedText}
  ```

  Rules:
  - Use format: type(scope): description
  - Types: feat, fix, refactor, docs, test, chore, perf, style
  - Description must be imperative mood, lowercase, no period
  - Keep under 72 characters
showInLightbulb: false
target: "task"