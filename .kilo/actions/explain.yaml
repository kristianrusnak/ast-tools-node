name: "Explain Code"
order: 1
prompt: |
  Explain the following code from ${filePath}:${startLine}-${endLine} in plain language:

  ```
  ${selectedText}
  ```

  Cover:
  1. What the code does at a high level
  2. Key algorithms or patterns used
  3. Data flow through the code
  4. Any non-obvious behaviour or side effects
showInLightbulb: true
codeActionKind: "refactor"
target: "task"